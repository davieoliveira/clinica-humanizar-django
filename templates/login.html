{% extends "base.html" %}
{% block title %}Entrar | Clínica Humanizar{% endblock %}
{% block content %}
<section>
    <span>Bem-vindo de volta</span>
    <h1>Entrar na sua conta</h1>
    <p>Informe seu e-mail e sua senha para continuar.</p>
    <form method="post">
        {% csrf_token %}
        <label for="email">E-mail</label>
        <input id="email" type="email" name="email" placeholder="seuemail@exemplo.com" required>
        <label for="senha">Senha</label>
        <input id="senha" type="password" name="senha" placeholder="Sua senha" required>
        <button type="submit">Entrar</button>
    </form>
    <p>Ainda não tem conta? <a href="{% url 'cadastro' %}">Cadastre-se</a></p>
</section>
{% endblock %}

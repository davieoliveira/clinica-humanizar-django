<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
{% block content %}
<section class="bg-light min-vh-100 d-flex align-items-center py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
                
                <div class="card shadow-sm border-light">
                    <div class="card-body p-4 p-sm-5">

                        <div class="mb-4 text-start">
                            <h1 class="h4 fw-bold mb-2">Entre na sua conta</h1>
                            <p class="text-muted small mb-0">Bem-vindo de volta! Informe seus dados para continuar.</p>
                        </div>

                        <form method="post">
                            {% csrf_token %}
                            
                            <!-- email -->
                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold small text-dark">E-mail</label>
                                <input id="email" type="email" name="email" class="form-control" placeholder="nome@exemplo.com" required>
                            </div>
                            
                            <!-- senha -->
                            <div class="mb-3">
                                <label for="senha" class="form-label fw-semibold small text-dark">Senha</label>
                                <div class="input-group">
                                    <input id="senha" type="password" name="senha" class="form-control border-end-0" placeholder="Digite sua senha" required>
                                    <span class="input-group-text bg-white border-start-0 text-muted" style="cursor: pointer;">
                                        <!-- icone do bootstrap -->
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-eye" viewBox="0 0 16 16">
                                            <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8M1.173 8a13 13 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5s3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5s-3.879-1.168-5.168-2.457A13 13 0 0 1 1.172 8z"/>
                                            <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5M4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0"/>
                                        </svg>
                                    </span>
                                </div>
                            </div>
                            
                            <!-- checkbox e esqueci a senha -->
                            <div class="d-flex justify-content-between align-items-center mb-4 mt-3">
                                <div class="form-check mb-0">
                                    <input class="form-check-input" type="checkbox" id="lembrar" name="lembrar">
                                    <label class="form-check-label small text-muted" for="lembrar">
                                        Lembrar de mim
                                    </label>
                                </div>
                                <a href="#" class="text-decoration-none small text-primary" style="color: #0d6efd;">Esqueceu a senha?</a>
                            </div>
                            
                            <!-- Botão Entrar -->
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary py-2 fw-medium" style="background-color: #0d6efd; border-color: #0d6efd;">Entrar</button>
                            </div>
                        </form>

                    </div>
                    
                    <!-- footer -->
                    <div class="card-footer bg-light border-top text-center py-3">
                        <p class="mb-0 small text-muted">
                            Ainda não tem uma conta? <a href="{% url 'cadastro' %}" class="text-decoration-none text-primary" style="color: #0d6efd;">Cadastre-se</a>
                        </p>
                    </div>
                </div>
                
            </div>
        </div>
    </div>
</section>
{% endblock %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

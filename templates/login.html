
{% extends "base.html" %}

{% block title %}Login | Clínica Humanizar{% endblock %}

{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
    
<div class="container-fluid bg-light min-vh-90 d-flex justify-content-center align-items-center py-5">

    <div class="card shadow-sm border-0 rounded-3" style="width: 100%; max-width: 420px;">

        <div class="card-body p-4">

            <h4 class="fw-semibold mb-1">
                Entre na sua conta
            </h4>

            <p class="text-secondary small mb-4">
                Bem-vindo de volta! Informe seus dados para continuar.
            </p>

            <form method="POST">

                {% csrf_token %}

                <!-- email -->
                <div class="mb-3">
                    <label for="email" class="form-label small fw-medium">
                        E-mail
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        name="email"
                        placeholder="nome@exemplo.com"
                        required
                    >
                </div>

                <!-- senha -->
                <div class="mb-3">
                    <label for="senha" class="form-label small fw-medium">
                        Senha
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        required
                    >
                </div>

                <!-- Opções -->
                <div class="d-flex justify-content-between align-items-center mb-3">

                    <div class="form-check">
                        <input
                            class="form-check-input"
                            type="checkbox"
                            id="lembrar"
                            name="lembrar"
                        >

                        <label class="form-check-label small" for="lembrar">
                            Lembrar de mim
                        </label>
                    </div>

                    <a href="#" class="small text-primary text-decoration-none">
                        Esqueceu a senha?
                    </a>

                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Entrar
                </button>

            </form>

        </div>

        <div class="card-footer bg-light text-center py-3">
            <span class="text-secondary small">
                Ainda não tem uma conta?
            </span>

            <a href="#" class="small text-primary text-decoration-none fw-medium">
                Cadastre-se
            </a>
        </div>

    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
{% endblock %}

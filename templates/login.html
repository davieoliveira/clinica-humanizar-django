<section class="form-card">
    <span class="eyebrow">Bem-vindo de volta</span>
    <h1>Entrar na sua conta</h1>
    <p class="muted">Informe seu e-mail e sua senha para continuar.</p>
    <form method="post" action="/login">
        <label for="email">E-mail</label>
        <input id="email" type="email" name="email" placeholder="seuemail@exemplo.com" required>
        
        <label for="senha">Senha</label>
        <input id="senha" type="password" name="senha" placeholder="Sua senha" required>
        
        <button class="button full" type="submit">Entrar</button>
    </form>
    <p class="form-foot">Ainda não tem conta? <a href="/cadastro">Cadastre-se</a></p>
</section>
